<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼贴卡片墙 Collage Card Grid — Navimow 设计系统组件</title>
<style>
  /* ============================================================
     Navimow 设计系统 · 组件：拼贴卡片墙（Collage Card Grid）v1.2
     ------------------------------------------------------------
     硬性规则：
     [1] 图片/视频永远是卡片背景，object-fit:cover 撑满容器；
         文字永远叠加在媒体之上（任何变体都不出现"媒体在文字下方"）
     [2] 整个拼贴墙在页面中始终水平居中
     [3] 四边严格对齐：CSS Grid 10 行基准行，每列卡片行跨度之和
         相等（4+6 / 7+3 / 5+5），顶边、底边、左右边全部齐平，
         任何卡片都不会凹进或凸出
     [4] 每张卡片 16px 圆角；文字边距 16
     [5] 文字对齐：默认左下；变体 .top-center 居中 + 顶部 48px
     [6] Hover：背景媒体轻微放大 + 跟随鼠标 3D 倾斜
     [7] 视频：纯视频默认自动播放；多视频同一时刻只播一个，轮流播放
     ============================================================ */
  :root{
    --brand:#FF5A00;
    --card-dark:#1A1A1A;
    --white:#FFFFFF;
    --white-70:rgba(255,255,255,.70);
    --white-44:rgba(255,255,255,.44);
    --radius:16px;
    --pad:16px;
    --gap:16px;
    --row:100px;                 /* 基准行高 */
    --font:"Inter","MiSans Latin","Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);background:#000;color:var(--white);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;   /* [2] 整墙始终居中 */
    justify-content:center;padding:40px;-webkit-font-smoothing:antialiased}

  .demo-title{font-size:14px;margin-bottom:24px;font-weight:600;letter-spacing:.02em;text-align:center}
  .demo-title small{color:var(--white-44);font-weight:400;display:block;margin-top:4px}

  /* ============================================================
     [3] 拼贴容器：Grid 3 列 × 10 行，宽度随内容自适应
         每列行跨度之和 = 10（4+6 / 7+3 / 5+5）→ 四边严格对齐
     ============================================================ */
  .collage{
    display:grid;
    grid-template-columns:repeat(3, 400px);
    grid-template-rows:repeat(10, var(--row));
    gap:var(--gap);
    width:fit-content;            /* 宽度以内容自适应 */
  }
  /* 列位置 + 显式行放置（每列跨度之和恒为 10，四边严格对齐） */
  .c1{grid-column:1} .c2{grid-column:2} .c3{grid-column:3}
  .gr-a{grid-row:1/span 4}
  .gr-b{grid-row:5/span 6}
  .gr-c{grid-row:1/span 7}
  .gr-d{grid-row:8/span 3}
  .gr-e{grid-row:1/span 5}
  .gr-f{grid-row:6/span 5}

  /* ============================================================
     单张卡片
     ============================================================ */
  .card{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card-dark);
    cursor:pointer;
    isolation:isolate;
    transform-style:preserve-3d;
    will-change:transform;
  }

  /* [1] 媒体层：永远是背景，撑满容器 */
  .card .media{position:absolute;inset:0;z-index:0;overflow:hidden}
  .card .media img,
  .card .media video{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.001);
    transition:transform .7s var(--ease);
  }

  /* [1] 文字层：永远叠加在媒体之上 */
  .card .text{
    position:absolute;inset:0;
    z-index:1;
    display:flex;flex-direction:column;
    justify-content:flex-end;             /* 默认：左下对齐 */
    align-items:flex-start;
    padding:var(--pad);
    color:var(--white);
    pointer-events:none;
  }
  .card .text h3{
    font-size:26px;font-weight:600;line-height:1.35;letter-spacing:.01em;
    text-shadow:0 1px 12px rgba(0,0,0,.5);
  }
  .card .text p{
    font-size:14px;font-weight:400;line-height:1.5;margin-top:6px;
    color:var(--white-70);
    text-shadow:0 1px 8px rgba(0,0,0,.55);
  }

  /* 变体：居中 + 顶部 48px */
  .card.top-center .text{
    justify-content:flex-start;
    align-items:center;text-align:center;
    padding-top:48px;
  }
  .card.top-center .text p{max-width:88%}

  /* 深色纯底卡：媒体同样 cover 撑满（深色底仅作图片加载前兜底） */
  .card.dark{background:var(--card-dark)}
  .card.dark .media img,.card.dark .media video{object-fit:cover;transform:scale(1.001);padding:0}
  .card.dark:hover .media img{transform:scale(1.06)}

  /* 遮罩：保证叠加文字可读 */
  .card .scrim{
    position:absolute;inset:0;z-index:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,transparent 40%);
    pointer-events:none;
  }
  .card.dark .scrim{background:none}

  /* 无文字卡 */
  .card.no-text .text{display:none}

  /* [6] Hover：媒体轻微放大（3D 倾斜由 JS 驱动） */
  .card:hover .media img,
  .card:hover .media video{transform:scale(1.06)}
  .card.dark:hover .media img{transform:scale(1.03)}

  /* 播放指示 */
  .card .playing-dot{
    position:absolute;top:14px;right:14px;z-index:2;
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.30);
    transition:background .3s;
  }
  .card.is-playing .playing-dot{background:var(--brand);box-shadow:0 0 0 4px rgba(255,90,0,.25)}

  @media(max-width:1260px){
    body{justify-content:flex-start}
    .collage{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:var(--row)}
    .c1,.c2,.c3{grid-column:1}
  }
</style>
</head>
<body>
  <div class="demo-title">
    拼贴卡片墙 · Collage Card Grid <span style="color:var(--brand)">v1.2</span>
    <small>媒体永远全出血背景+文字叠加 / 整墙居中 / 四边严格对齐(Grid行跨度) / 16圆角 / Hover放大+3D / 视频轮流播放</small>
  </div>

  <!-- ===================== 组件实例 ===================== -->
  <div class="collage" id="collage">

    <!-- 列1：行1-4 + 行5-10 -->
    <div class="card dark c1 gr-a">
      <div class="media"><img src="assets/vision-ir.png" alt=""></div>
      <div class="text" style="justify-content:flex-start;align-items:center;text-align:center;padding-top:48px"><h3>新一代 1/1.3 英寸传感器</h3></div>
    </div>
    <div class="card top-center c1 gr-b">
      <div class="media"><img src="assets/xero-turn.png" alt=""></div>
      <div class="scrim"></div>
      <div class="text"><h3>360° 全地形掌控</h3></div>
    </div>

    <!-- 列2：行1-7 + 行8-10 -->
    <div class="card top-center c2 gr-c">
      <div class="media"><video src="https://www.w3schools.com/html/mov_bbb.mp4" muted loop playsinline></video></div>
      <div class="scrim"></div>
      <div class="playing-dot"></div>
      <div class="text"><h3>人物居中和跟随</h3></div>
    </div>
    <div class="card dark c2 gr-d">
      <div class="media"><img src="assets/dropmow.jpg" alt=""></div>
      <div class="text" style="justify-content:flex-start;align-items:center;text-align:center;padding-top:40px"><h3>4 小时超长续航</h3></div>
    </div>

    <!-- 列3：行1-5 + 行6-10 -->
    <div class="card dark c3 gr-e">
      <div class="media"><img src="assets/pos-under.png" alt=""></div>
      <div class="text" style="justify-content:flex-start;align-items:center;text-align:center;padding-top:48px"><h3>双 OLED 高亮触摸屏</h3></div>
    </div>
    <div class="card c3 gr-f">
      <div class="media"><video src="https://www.w3schools.com/html/mov_bbb.mp4" muted loop playsinline></video></div>
      <div class="scrim" style="background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 42%)"></div>
      <div class="playing-dot"></div>
      <div class="text"><h3>双麦克风直连</h3><p>左下对齐变体 · 视频轮流播放</p></div>
    </div>

  </div>

<script>
  const cards=[...document.querySelectorAll('.card')];

  /* ---- Hover 跟随鼠标 3D 倾斜 ---- */
  cards.forEach(card=>{
    const rx={v:0}, ry={v:0}, trx={v:0}, try={v:0};
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const mx=(e.clientX-r.left)/r.width-.5;
      const my=(e.clientY-r.top)/r.height-.5;
      trx.v=-my*6;
      try.v=mx*8;
    });
    card.addEventListener('mouseleave',()=>{trx.v=0;try.v=0;});
    (function loop(){
      rx.v+=(trx.v-rx.v)*.12;
      ry.v+=(try.v-ry.v)*.12;
      card.style.transform=`perspective(800px) rotateX(${rx.v}deg) rotateY(${ry.v}deg)`;
      requestAnimationFrame(loop);
    })();
  });

  /* ---- 视频轮流播放：同一时刻只播一个 ---- */
  const videos=[...document.querySelectorAll('.card video')];
  videos.forEach(v=>{ v.muted=true; v.setAttribute('autoplay',''); v.setAttribute('muted',''); v.setAttribute('playsinline',''); });

  function safePlay(v){
    return v.play().catch(()=>{
      v.muted=true;
      return v.play().catch(()=>{});
    });
  }

  if(videos.length>1){
    let cur=0;
    function playOnly(i){
      videos.forEach((v,idx)=>{
        const card=v.closest('.card');
        if(idx===i){
          safePlay(v);
          card.classList.add('is-playing');
        }else{
          v.pause();
          v.currentTime=0;
          card.classList.remove('is-playing');
        }
      });
      cur=i;
    }
    playOnly(0);
    setInterval(()=>playOnly((cur+1)%videos.length),4000);
  }else if(videos.length===1){
    safePlay(videos[0]);
    videos[0].closest('.card').classList.add('is-playing');
  }
</script>
</body>
</html>
